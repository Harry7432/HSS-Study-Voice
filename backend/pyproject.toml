[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harrysilvafalavinha-stack", email = "harrysousasilva@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pydub>=0.25.1",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

