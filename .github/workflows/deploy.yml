name: Deploy HSS Study Voice

on:
  push:
    branches:
      - master

concurrency:
  group: hss-study-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -t ed25519 "$VPS_HOST" > ~/.ssh/known_hosts.tmp 2>/dev/null

          ACTUAL_FINGERPRINT=$(ssh-keygen -lf ~/.ssh/known_hosts.tmp -E sha256 | awk '{print $2}')

          if [ "$ACTUAL_FINGERPRINT" != "$VPS_HOST_FINGERPRINT" ]; then
            echo "ERRO: fingerprint da VPS não confere."
            exit 1
          fi

          mv ~/.ssh/known_hosts.tmp ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" << 'EOF'

          set -e

          echo "======================================"
          echo " HSS Study Voice - Deploy"
          echo "======================================"

          cd /opt/hss-study-voice

          PREVIOUS_SHA=$(git rev-parse HEAD)
          echo "Versão anterior: $PREVIOUS_SHA"

          echo "Atualizando código..."
          git fetch origin master
          git reset --hard origin/master

          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Nova versão: $CURRENT_SHA"

          echo "Atualizando backend..."
          cd /opt/hss-study-voice/backend
          /home/hssdeploy/.local/bin/uv sync --frozen

          echo "Build do frontend..."
          cd /opt/hss-study-voice/frontend

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          nvm use --lts
          npm ci
          npm run build

          echo "Reiniciando backend..."
          sudo systemctl restart hss-backend

          echo "Reiniciando frontend..."
          sudo docker restart hss-study-web

          echo "Aguardando serviços..."
          sleep 5

          echo "Validando backend..."
          curl --fail --silent http://127.0.0.1:8000/health
          echo

          echo "Validando produção..."
          curl --fail --silent --head https://study.storehss.com
          echo

          echo "======================================"
          echo " Deploy concluído com sucesso!"
          echo "======================================"

          EOF